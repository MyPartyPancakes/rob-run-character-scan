name: rob-run-scan

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rob-run-scan-app
    container_name: rob-run-scan
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
    ports:
      - "127.0.0.1:13787:8787"
    networks:
      - rob-run-scan
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    cpus: "0.75"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rob-run-scan:
    name: rob-run-scan
    driver: bridge
    internal: false
