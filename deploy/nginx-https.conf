server {
    listen 80;
    listen [::]:80;
    server_name mypartypancakes.ru www.mypartypancakes.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://mypartypancakes.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mypartypancakes.ru www.mypartypancakes.ru;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/mypartypancakes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypartypancakes.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RobRunSSL:10m;
    ssl_session_tickets off;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    if ($host = www.mypartypancakes.ru) {
        return 301 https://mypartypancakes.ru$request_uri;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:13787;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
